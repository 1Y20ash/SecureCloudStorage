{% extends "base.html" %}
{% block title %}Sign in — SecureVault{% endblock %}

{% block content %}
<div class="focused-card reveal is-visible">
    <div class="focused-card-header">
        <span class="eyebrow"><span class="eyebrow-dot"></span> Vault Access</span>
        <h1>Welcome back</h1>
        <p>Sign in to your private encrypted vault.</p>
    </div>

    <form method="POST">
        <div class="form-group" style="margin-top: 0;">
            <label for="email">Email address</label>
            <input id="email" class="input-control" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
            <label for="password">Account password</label>
            <div class="input-wrap">
                <input id="password" class="input-control" type="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
                <button class="toggle-pw" type="button" data-target="password" aria-label="Show password">👁</button>
            </div>
        </div>

        <button class="button submit-btn" type="submit">Sign in securely →</button>
    </form>

    <div class="auth-footer-link">
        New here? <a href="{{ url_for('register') }}">Create your secure vault</a>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Login - Secure Cloud Storage{% endblock %}
{% block content %}
<div class="card">
    <h1>Login</h1>
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Upload File - Secure Cloud Storage{% endblock %}
{% block content %}
<div class="card">
    <h1>Secure File Upload</h1>
    <p>Your file will be encrypted with AES-256-GCM before it is stored.</p>

    <form method="POST" enctype="multipart/form-data">
        <label for="file">Choose file</label>
        <input id="file" type="file" name="file" required>

        <label for="encryption_password">Encryption password</label>
        <input id="encryption_password" type="password" name="encryption_password" minlength="8" required>
        <small>Remember this password. It will be required for decryption.</small>

        <button type="submit">Encrypt &amp; Upload</button>
    </form>

    <p><a href="{{ url_for('dashboard') }}">Back to Dashboard</a></p>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7faf9">
    <title>{% block title %}SecureVault{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/premium.css') }}">
    <script src="{{ url_for('static', filename='js/ui.js') }}" defer></script>
</head>
<body>
    <div class="aurora aurora-one"></div>
    <div class="aurora aurora-two"></div>
    <nav class="navbar glass">
        <div class="nav-inner">
            <a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">⌁</span><span>SecureVault</span></a>
            <div class="nav-links">
                {% if current_user.is_authenticated %}
                    <a class="nav-link" href="{{ url_for('dashboard') }}">Vault</a>
                    <a class="nav-cta" href="{{ url_for('upload') }}">Upload</a>
                    <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                {% else %}
                    <a class="nav-link" href="{{ url_for('login') }}">Login</a>
                    <a class="nav-cta" href="{{ url_for('register') }}">Create account</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>

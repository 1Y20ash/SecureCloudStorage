name: Tests

on:
  push:
    branches: ["main", "feature/ps-26190-dms", "feature/ps-26190-phase2-rbac", "feature/ps-26190-phase3-audit-integrity", "feature/phase5-evidence-chain-of-custody"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///ci_secure_cloud_storage.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Initialize database schema
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q
